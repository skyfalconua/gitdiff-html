name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (static musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: x86_64
            archive: tar.gz

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: aarch64
            archive: tar.gz

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            archive: zip

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: aarch64
            archive: zip

          # macOS
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            archive: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Error: Invalid release tag '$TAG'."
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g., v1.2.3)"
            exit 1
          fi

          echo "Validated release tag: $TAG"

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable

      - name: Install musl tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          BIN="gitdiff-html"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="gitdiff-html.exe"
          fi

          NAME="gitdiff-html-$PLATFORM-$ARCH"
          STAGE="$RUNNER_TEMP/$NAME"
          OUT="$GITHUB_WORKSPACE/dist"

          mkdir -p "$OUT"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp "target/$TARGET/release/$BIN" "$STAGE/"

          # Include license and README files when present.
          for f in LICENSE* COPYING* README*; do
            if [[ -f "$f" ]]; then
              cp "$f" "$STAGE/"
            fi
          done

          cd "$STAGE"

          if [[ "$ARCHIVE" == "zip" ]]; then
            7z a "$OUT/$NAME.zip" ./*
          else
            tar -czf "$OUT/$NAME.tar.gz" *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          find . -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) \
            -print0 |
            sort -z |
            xargs -0 -r sha256sum > SHA256SUMS.txt

          test -s SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
